[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.0"
description = "Recursive self-improvement harness: give a model a goal and a metric, let an agent iterate until convergence."
requires-python = ">=3.10"
dependencies = ["pyyaml", "pydantic>=2", "safetensors", "torch", "huggingface_hub"]

[project.optional-dependencies]
# Example: Qwen3.5-0.8B on MATH (vLLM generation + math-verify grading)
math = ["vllm", "transformers", "math-verify", "datasets", "pandas", "pyarrow"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]

[tool.setuptools.package-data]
rsi = ["templates/*", "strategies/**/*"]
