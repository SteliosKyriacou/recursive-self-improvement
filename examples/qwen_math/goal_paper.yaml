# Paper-faithful variant of Exp 8: pure weight-space programming, no gradients, the agent has
# NO GPU (CPU-only weight analysis) and can run the model only through 50 metered probes.
name: qwen35-math-wsp
goal: |
  Make Qwen3.5-0.8B better at competition math (MATH-style problems, thinking mode on) by
  editing its weights directly — no gradient-based training. Keep the normal chat format with
  the final answer in \boxed{}.
notes: |
  You have no GPU: analyse weights and (short) activations on CPU. Use your forward-pass budget
  (tools/probe.py) deliberately — each probe of 32 problems at 16k tokens takes ~5-8 min.
  The base model's main failure is looping until the token limit.

target:
  kind: hf_weights
  model: Qwen/Qwen3.5-0.8B

evaluation:
  metric: metric.py
  primary: accuracy
  direction: maximize
  splits: {dev: data/dev.jsonl, val: data/val.jsonl, test: data/test.jsonl}
  config: {max_tokens: 32768, samples: 1, thinking: true, gpu_memory_utilization: 0.85}
  timeout_s: 7200

probe:
  forward_pass_budget: 50
  max_examples: 32
  config: {samples: 1, max_tokens: 16384, gpu_memory_utilization: 0.85}

search:
  max_iterations: 8
  patience: 3
  min_delta: 0.03
  strategies: [weight_programming, agentic_optimization]   # agent edits + tuning of its edit recipes

population:
  controller: llm
  max_experiments: 2
  size: 2
  promote_top: 1
  screen: {n: 16, config: {max_tokens: 16384}}

agentic_optimization: {generations: 3, population: 4, llm: true}

agent:
  backend: claude_code
  timeout_s: 10800
  gpu: false

guards:
  allow_model_candidates: false    # weights only, architecture fixed
  max_changed_fraction: 0.01       # surgical edits only (paper: 0.016%)
  allowed_keys: "language_model"   # text model only
  forbidden_patterns: ["HuggingFaceH4/MATH-500", "math500", "MATH-500/test"]
